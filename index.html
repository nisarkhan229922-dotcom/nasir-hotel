
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9f2020">

  <link rel="manifest" href="/nasir-hotel/manifest.json">

  <title>ناصر ہوٹل | Nasir Hotel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, "Noto Nastaliq Urdu", sans-serif;
    }

    header {
      background: #9f2020;
      color: #fff;
      text-align: center;
      padding: 25px 14px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 38px);
    }

    header p {
      margin: 8px 0 0;
      line-height: 1.8;
    }

    main {
      max-width: 920px;
      margin: 20px auto;
      padding: 0 13px;
    }

    .menu {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 16px;
    }

    .dish {
      background: #fff;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 3px 12px #00000012;
      display: flex;
      flex-direction: column;
    }

    .dish img {
      display: block;
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #e8e8e8;
    }

    .dish .body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .dish h2 {
      margin: 0;
      font-size: 23px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 0;
    }

    .qty {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 4px 0;
    }

    .qty button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 9px;
      background: #9f2020;
      color: #fff;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .qty span {
      font-size: 20px;
      font-weight: bold;
      min-width: 25px;
      text-align: center;
    }

    .order {
      display: block;
      text-align: center;
      background: #168346;
      color: #fff;
      text-decoration: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: auto;
    }

    .order:hover,
    .order:focus {
      background: #116a37;
    }

    footer {
      text-align: center;
      background: #222;
      color: #fff;
      padding: 20px 12px;
      line-height: 1.9;
      margin-top: 24px;
    }

    .empty {
      text-align: center;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
    }

    .small {
      font-size: 14px;
      color: #555;
      margin: 0;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <h1>ناصر ہوٹل <span dir="ltr">(Nasir Hotel)</span></h1>
    <p>تازہ اور مزیدار کھانے — واٹس ایپ پر آرڈر کریں</p>
  </header>

  <main>
    <section
      id="menu"
      class="menu"
      aria-label="کھانے کا مینو">
    </section>
  </main>

  <footer>
    <div>ناصر ہوٹل</div>
    <div dir="ltr">WhatsApp: +966 55 007 5986</div>
  </footer>

  <script>
    const MENU = [
      {
        name: "چکن کڑاہی",
        price: "450",
        image: "https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?auto=format&fit=crop&w=900&q=80"
      },
      {
        name: "بریانی",
        price: "250",
        image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?auto=format&fit=crop&w=900&q=80"
      },
      {
        name: "روغنی نان",
        price: "40",
        image: "https://images.unsplash.com/photo-1610057099431-d73a1c9d2f2f?auto=format&fit=crop&w=900&q=80"
      }
    ];

    const WHATSAPP_NUMBER = "966550075986";
    const root = document.getElementById("menu");

    function makeText(tag, text, className) {
      const el = document.createElement(tag);

      if (className) {
        el.className = className;
      }

      el.textContent = text;
      return el;
    }

    if (!MENU.length) {
      root.appendChild(
        makeText("p", "فی الحال مینو دستیاب نہیں۔", "empty")
      );
    } else {
      MENU.forEach(item => {
        const card = document.createElement("article");
        card.className = "dish";

        if (item.image) {
          const img = document.createElement("img");
          img.src = item.image;
          img.alt = item.name;
          img.loading = "lazy";

          img.onerror = () => {
            img.style.display = "none";
          };

          card.appendChild(img);
        }

        const body = document.createElement("div");
        body.className = "body";

        body.appendChild(makeText("h2", item.name));

        body.appendChild(
          makeText("p", "ریٹ: " + item.price + " ریال", "price")
        );

        let qty = 1;

        const controls = document.createElement("div");
        controls.className = "qty";

        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";
        minus.setAttribute("aria-label", "مقدار کم کریں");

        const count = document.createElement("span");
        count.textContent = qty;

        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "+";
        plus.setAttribute("aria-label", "مقدار بڑھائیں");

        controls.append(minus, count, plus);

        body.appendChild(
          makeText("p", "مقدار منتخب کریں", "small")
        );

        body.appendChild(controls);

        const total = makeText(
          "p",
          "کل: " + (Number(item.price) * qty).toFixed(2) + " ریال",
          "price"
        );

        body.appendChild(total);

        const link = document.createElement("a");
        link.className = "order";
        link.textContent = "واٹس ایپ پر آرڈر کریں";
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const updateLink = () => {
          const totalPrice =
            (Number(item.price) * qty).toFixed(2);

          total.textContent = "کل: " + totalPrice + " ریال";

          link.href =
            "https://wa.me/" + WHATSAPP_NUMBER +
            "?text=" + encodeURIComponent(
              "السلام علیکم، مجھے " + item.name +
              " آرڈر کرنا ہے۔ مقدار: " + qty +
              "۔ فی عدد قیمت: " + item.price +
              " ریال۔ کل قیمت: " + totalPrice + " ریال۔"
            );
        };

        minus.addEventListener("click", () => {
          if (qty > 1) {
            qty--;
          }

          count.textContent = qty;
          updateLink();
        });

        plus.addEventListener("click", () => {
          qty++;
          count.textContent = qty;
          updateLink();
        });

        updateLink();

        body.appendChild(link);
        card.appendChild(body);
        root.appendChild(card);
      });
    }
  </script>

  <!-- Nasir Hotel Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register(
          "/nasir-hotel/pwabuilder-sw.js",
          { scope: "/nasir-hotel/" }
        ).catch(function (error) {
          console.error("Service Worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
